<li
  class="task-item"
  [class.task-item--completed]="task().completed"
  [class.task-item--removing]="removing()"
>
  <label class="task-item__checkbox-wrap">
    <input
      type="checkbox"
      class="task-item__checkbox-input"
      [checked]="task().completed"
      (change)="toggle.emit()"
      [attr.aria-label]="'Toggle ' + task().title"
    />
    <span class="task-item__checkbox-box" aria-hidden="true"></span>
  </label>

  @if (editing()) {
    <input
      #editInput
      type="text"
      class="task-item__edit-input"
      [value]="draftTitle()"
      (input)="draftTitle.set(editInput.value)"
      (keydown.enter)="saveEdit()"
      (keydown.escape)="cancelEdit()"
      (blur)="saveEdit()"
    />
  } @else {
    <span class="task-item__title" (dblclick)="startEdit()">{{ task().title }}</span>
  }

  <button
    type="button"
    class="task-item__delete"
    (click)="startRemove()"
    [attr.aria-label]="'Delete ' + task().title"
  >
    ✕
  </button>
</li>
